version: "3.9"

services:
  backend:
    container_name: backend
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - ai_chat_network
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - ai_chat_network

networks:
  ai_chat_network:
    name: ai_chat_network
    driver: bridge
